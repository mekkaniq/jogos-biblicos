name: App iOS → TestFlight
# Manual: Actions → "App iOS → TestFlight" → Run workflow. Não roda sozinho.
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: "Número do build (aumente a cada envio: 1, 2, 3...)"
        required: true
        default: "1"
      version:
        description: "Versão que aparece na loja (ex.: 1.0)"
        required: true
        default: "1.0"
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: br.com.lumi.jogosbiblicos
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependências e projeto iOS
        working-directory: app-ios
        run: |
          npm install --legacy-peer-deps
          npx cap add ios
          npx capacitor-assets generate --ios --iconBackgroundColor '#e9b45a' --splashBackgroundColor '#fbf3e0' --splashBackgroundColorDark '#fbf3e0'
          npx cap sync ios
      - name: Chave da App Store Connect
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "${{ secrets.ASC_KEY_P8 }}" > ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
      - name: Conferir os secrets (só mostra tamanhos, nunca os valores)
        run: |
          K=~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8
          echo "::notice::APPLE_TEAM_ID: ${#TEAM_ID} caracteres (esperado 10)"
          echo "::notice::ASC_KEY_ID: ${#KEY_ID} caracteres (esperado 10)"
          echo "::notice::ASC_ISSUER_ID: ${#ISSUER_ID} caracteres (esperado 36)"
          echo "::notice::ASC_KEY_P8: $(wc -l < $K | tr -d ' ') linhas; começa com: $(head -1 $K | cut -c1-27); termina com: $(tail -1 $K | cut -c1-25)"
      - name: Versão, build, iPhone em pé e áudio da narração
        working-directory: app-ios/ios/App
        run: |
          P=App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ inputs.build_number }}" $P
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ inputs.version }}" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string ${{ inputs.version }}" $P
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" $P || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName Lumi Jogos" $P || /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Lumi Jogos" $P
          /usr/libexec/PlistBuddy -c "Add :CFBundleDevelopmentRegion string pt-BR" $P || /usr/libexec/PlistBuddy -c "Set :CFBundleDevelopmentRegion pt-BR" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations" $P || true
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations array" $P
          /usr/libexec/PlistBuddy -c "Add :UISupportedInterfaceOrientations:0 string UIInterfaceOrientationPortrait" $P
          /usr/libexec/PlistBuddy -c "Delete :UISupportedInterfaceOrientations~ipad" $P || true
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" $P || true
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = ${{ inputs.build_number }};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = [^;]*;/MARKETING_VERSION = ${{ inputs.version }};/g" App.xcodeproj/project.pbxproj
          sed -i '' "s/PRODUCT_BUNDLE_IDENTIFIER = [^;]*;/PRODUCT_BUNDLE_IDENTIFIER = ${BUNDLE_ID};/g" App.xcodeproj/project.pbxproj
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2";/TARGETED_DEVICE_FAMILY = 1;/g' App.xcodeproj/project.pbxproj
          # narração das histórias toca mesmo com o iPhone no modo silencioso
          python3 - <<'PY'
          import re, os
          p='App/AppDelegate.swift'
          s=open(p).read() if os.path.exists(p) else ''
          if s and 'AVFoundation' not in s:
              s=s.replace('import UIKit','import UIKit\nimport AVFoundation',1)
              s=re.sub(r'(didFinishLaunchingWithOptions[^{]*\{)', r'\1\n        try? AVAudioSession.sharedInstance().setCategory(.playback, mode: .spokenAudio, options: [.mixWithOthers])', s, count=1)
          if s: open(p,'w').write(s)
          print('audio da narracao:', 'AVAudioSession' in s)
          PY
      - name: Archive (sem assinar; a assinatura de distribuição é feita na exportação)
        working-directory: app-ios/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM_ID CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" archive
      - name: Exportar e enviar ao TestFlight
        working-directory: app-ios/ios/App
        run: |
          cat > $RUNNER_TEMP/export.plist <<PL
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PL
          set +e
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -allowProvisioningUpdates -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
            -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER_ID 2>&1 | tee $RUNNER_TEMP/export.log
          RC=${PIPESTATUS[0]}
          if [ "$RC" != "0" ]; then
            echo "::error::exportArchive saiu com código $RC"
            grep -iE "error|fail|denied|not found|no profiles|unauthor|forbidden|invalid|bundle" $RUNNER_TEMP/export.log | grep -v "^\s*$" | head -12 | while IFS= read -r l; do echo "::error::${l:0:300}"; done
            tail -8 $RUNNER_TEMP/export.log | while IFS= read -r l; do echo "::warning::${l:0:300}"; done
          fi
          exit $RC
